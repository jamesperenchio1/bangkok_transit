name: Swarm

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: swarm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run sim:acceptance
      - run: npm run sim
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-artifacts
          path: sim-artifacts/
          if-no-files-found: warn
          retention-days: 14
