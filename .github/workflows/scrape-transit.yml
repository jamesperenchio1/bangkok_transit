name: Scrape Transit Data

on:
  schedule:
    # Every Monday 00:00 Bangkok time (UTC+7 = Sunday 17:00 UTC)
    - cron: '0 17 * * 0'
  workflow_dispatch:
    inputs:
      fresh:
        description: 'Bypass API response cache'
        required: false
        default: 'false'
        type: boolean

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scrape transit data from OpenStreetMap
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.fresh }}" = "true" ]; then
            ARGS="--fresh"
          fi
          npm run scrape -- $ARGS

      - name: Validate updated data
        run: npm run validate-data

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/canonical/stations.json data/canonical/lines.json \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and open PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="data/osm-sync-$(date +%Y-%m-%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/canonical/stations.json data/canonical/lines.json
          git commit -m "data: sync stations from OpenStreetMap ($(date +%Y-%m-%d))"
          git push origin "$BRANCH"
          gh pr create \
            --title "data: OSM transit sync $(date +%Y-%m-%d)" \
            --body "Automated weekly sync from OpenStreetMap Overpass API.

  **Changed files:**
  - \`data/canonical/stations.json\`
  - \`data/canonical/lines.json\`

  Review the diff to confirm new stations look correct before merging." \
            --base main \
            --head "$BRANCH"
