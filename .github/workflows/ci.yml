# Every push and pull request: lint, typecheck, unit tests, the poller's
# Workers-runtime tests, the end-to-end suite against the production build,
# and a throttled first-load performance budget. Deployment itself is
# Cloudflare Workers Builds (on push to main), so no Cloudflare credentials
# live in GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: Site
    runs-on: ubuntu-latest
    # The e2e matrix (every phone profile) takes 17+ minutes on a good run; the
    # run on main for #40 was cancelled at the old 20-minute limit with no test
    # failing, so a red result could not be told from a slow one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install Playwright Chromium and WebKit
        # WebKit is the engine of every iPhone browser; the alert:* projects need it.
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end tests (builds the site and serves it with wrangler)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  perf:
    name: Performance budget
    runs-on: ubuntu-latest
    # Slow 4G with a 4x CPU throttle makes the first load several times slower;
    # the spec's own 180 s timeout is the real limit, this is the job ceiling.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        # The budget is measured through the DevTools protocol, so Chromium is
        # the only engine needed (the spec skips the other projects).
        run: npx playwright install --with-deps chromium
      - name: Performance budget (Slow 4G, 4x CPU)
        # This step builds the site and serves it with wrangler, exactly like
        # the e2e step above (see playwright.config.ts webServer).
        run: npm run test:perf
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: perf-report
          path: playwright-report/
          retention-days: 14

  poller:
    name: Poller
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/poller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: cloudflare/poller/.node-version
          cache: npm
          cache-dependency-path: cloudflare/poller/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle (dry-run deploy)
        run: npm run build
      - name: Smoke test (boot the real Worker in workerd, fire the cron)
        run: npm run smoke
      - run: npm audit --audit-level=high
