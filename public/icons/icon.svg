<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Wordmark monogram: "BT" with the operators' line colours as a stripe.
       Letters are drawn as heavy strokes (no font dependency) so they stay
       legible at 16 px in a browser tab. Full-bleed background so the same
       art works as a maskable icon; everything sits inside the central 80%
       safe zone. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3a7a"/>
      <stop offset="1" stop-color="#0a1230"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-width="52" stroke-linejoin="round">
    <!-- B -->
    <path d="M112 124 V372"/>
    <path d="M86 150 H186 a46 46 0 0 1 0 92 H86"/>
    <path d="M86 242 H196 a52 52 0 0 1 0 104 H86"/>
    <!-- T -->
    <path d="M322 150 H446"/>
    <path d="M384 124 V372"/>
  </g>
  <!-- line-colour stripe -->
  <g>
    <rect x="86" y="404" width="60" height="22" fill="#76b729"/>
    <rect x="146" y="404" width="60" height="22" fill="#00a651"/>
    <rect x="206" y="404" width="60" height="22" fill="#3b82f6"/>
    <rect x="266" y="404" width="60" height="22" fill="#b05fd6"/>
    <rect x="326" y="404" width="60" height="22" fill="#e0679a"/>
    <rect x="386" y="404" width="60" height="22" fill="#e0243a"/>
  </g>
</svg>
