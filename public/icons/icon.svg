<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- A tiny transit map: line colours follow the operators' (BTS Sukhumvit,
       MRT Blue, Purple, Gold, Pink...) meeting at a Siam-style interchange.
       Full-bleed background so the same art works as a maskable icon; all the
       linework sits inside the central 80% safe zone. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2a5e"/>
      <stop offset="1" stop-color="#0b1233"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="none" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M96 150 H190 L256 216 V300 L316 360 H416" stroke="#1e5bd8"/>
    <path d="M96 362 H196 L256 302 V216 L326 146 H416" stroke="#9b3fc4"/>
    <path d="M256 92 V420" stroke="#00a88f"/>
    <path d="M92 256 H420" stroke="#7ac62b"/>
  </g>
  <!-- stations -->
  <g fill="#ffffff">
    <circle cx="150" cy="256" r="11"/>
    <circle cx="362" cy="256" r="11"/>
    <circle cx="256" cy="150" r="11"/>
    <circle cx="256" cy="362" r="11"/>
    <circle cx="416" cy="150" r="11"/>
    <circle cx="416" cy="362" r="11"/>
    <circle cx="96" cy="150" r="11"/>
    <circle cx="96" cy="362" r="11"/>
  </g>
  <!-- interchange -->
  <circle cx="256" cy="256" r="38" fill="#ffffff"/>
  <circle cx="256" cy="256" r="20" fill="#0b1233"/>
</svg>
