# Every push and pull request: lint, typecheck, unit tests, the poller's
# Workers-runtime tests, and the end-to-end suite against the production
# build. Deployment itself is Cloudflare Workers Builds (on push to main),
# so no Cloudflare credentials live in GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: Site
    runs-on: ubuntu-latest
    # The e2e matrix (every phone profile) takes 17+ minutes on a good run; the
    # run on main for #40 was cancelled at the old 20-minute limit with no test
    # failing, so a red result could not be told from a slow one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install Playwright Chromium and WebKit
        # WebKit is the engine of every iPhone browser; the alert:* projects need it.
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end tests (builds the site and serves it with wrangler)
        run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  poller:
    name: Poller
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/poller
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: cloudflare/poller/.node-version
          cache: npm
          cache-dependency-path: cloudflare/poller/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle (dry-run deploy)
        run: npm run build
      - name: Smoke test (boot the real Worker in workerd, fire the cron)
        run: npm run smoke
      - run: npm audit --audit-level=high
