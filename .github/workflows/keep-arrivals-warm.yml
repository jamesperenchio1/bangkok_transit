name: Keep arrivals cache warm

# The upstream BTS API has no batch endpoint (confirmed by probing
# /arrivals/all, comma-separated codes, /arrivals/batch, and multi-segment
# paths - all 400/404), so the server fans out over every station itself.
#
# /api/arrivals serves one shared snapshot and, when it's old, starts the
# single fleet-wide upstream poll in the background (lib/arrivals-service.ts).
# So a single request here warms the snapshot for everybody.
#
# Timing note: GitHub throttles scheduled workflows on free/public repos far
# beyond the requested interval - observed runs land 2-6 HOURS apart, not every
# 5 minutes. That is no longer a correctness problem: the bulk route also
# refreshes in the background on every real page load, so visitors keep the
# cache warm themselves. This job is just a backstop for long quiet periods.
#
# See lib/bts.ts CACHE_SERVE_MS - a Redis entry is trusted up to 10 minutes old.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Warm the bulk arrivals cache, then confirm it filled
        env:
          BASE_URL: ${{ vars.APP_URL || 'https://bangkok-transit.vercel.app' }}
        run: |
          set -euo pipefail

          echo "triggering background refresh..."
          curl -s -o /dev/null -w "bulk: %{http_code} in %{time_total}s\n" \
            --max-time 30 "$BASE_URL/api/arrivals"

          # The first call only returns what the shared snapshot already had;
          # the poll it kicked off runs after the response. Give it time to
          # land, then ask again and count how many of the 61 live stations
          # are now present.
          echo "waiting for the background refresh to finish..."
          sleep 20

          # jq instead of `grep | wc`: under `set -o pipefail` a grep with no
          # match exits 1 and fails the whole job, so an empty snapshot crashed
          # the run instead of producing the warning below.
          body=$(curl -s --max-time 30 "$BASE_URL/api/arrivals")
          count=$(printf '%s' "$body" | jq '.arrivals | length' 2>/dev/null || echo 0)
          echo "warm: $count/61 stations cached"

          if [ "$count" -lt 55 ]; then
            echo "::warning::only $count/61 stations cached after refresh"
          fi
